name: StockPilot CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Lint application and tests
        run: flake8 app tests

      - name: Run tests
        run: pytest -v

  build:
    name: build
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build, run and smoke-test the Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="stockpilot:${GITHUB_SHA}"
          container="stockpilot-smoke-${GITHUB_RUN_ID}"
          response=""

          cleanup() {
            docker logs "$container" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build --tag "$image" .
          docker run --detach --name "$container" \
            --env "GIT_COMMIT=${GITHUB_SHA}" \
            --publish 8000:8000 \
            "$image"

          for attempt in $(seq 1 30); do
            if response="$(curl --silent --show-error --fail http://localhost:8000/health)"; then
              break
            fi
            sleep 2
          done

          if [[ -z "$response" ]]; then
            echo "Container did not return a healthy response within 60 seconds." >&2
            exit 1
          fi

          printf '%s' "$response" | jq --exit-status \
            --arg expected_commit "$GITHUB_SHA" \
            '(.status == "ok") and (.commit == $expected_commit)' >/dev/null
          echo "Container health and commit SHA verified."

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "RENDER_DEPLOY_HOOK repository secret is not configured." >&2
            exit 1
          fi

          if ! curl --silent --fail --output /dev/null \
            --request POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"; then
            echo "Render rejected the deploy-hook request." >&2
            exit 1
          fi
          echo "Render accepted the deploy request for ${GITHUB_SHA}."
